# Workspace SPECTRA
#
# Le crate `src-tauri` (application Cekarna existante) est intégré comme membre
# sans être modifié dans sa structure : il reste le shell applicatif pendant que
# les crates `spectra-*` apportent progressivement le modèle de domaine cible.
#
# Règle d'architecture (CLAUDE.md §4) : `spectra-core` ne dépend que de `serde`
# et de la stdlib, et ne fait aucune I/O.

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/spectra-core",
    "crates/spectra-store",
    "crates/spectra-audit",
    "crates/spectra-probe",
    "crates/spectra-probe-gen",
]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/cekarna/enquetes"
authors = ["SPECTRA contributors"]

[workspace.dependencies]
# Domaine (sans I/O)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Stockage
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }

# Hachage / audit
sha2 = "0.10"
hex = "0.4"
blake3 = "1.5"

# Erreurs
thiserror = "2.0"

# Temps
chrono = { version = "0.4", features = ["serde"] }
humantime-serde = "1.1"

# Identifiants
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }

# Async
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
url = "2.5"

# Validation
regex = "1.10"

# Rate limiting
governor = "0.8"

# Logging
tracing = "0.1"

# Cache
dashmap = "6"

# Crates internes
spectra-core = { path = "crates/spectra-core" }
spectra-store = { path = "crates/spectra-store" }
spectra-audit = { path = "crates/spectra-audit" }

# Lints appliqués aux seuls crates `spectra-*` (opt-in via `[lints] workspace = true`).
# Le crate `src-tauri` hérité n'y est volontairement pas soumis pour l'instant :
# il sera aligné quand sa dette technique aura été résorbée.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
