[package]
name = "cekarna"
version = "0.1.0"
description = "Cekarna - Desktop OSINT application for case investigations"
authors = ["Cekarna Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/cekarna/enquetes"
edition = "2021"

[lib]
name = "cekarna"
path = "src/lib.rs"

[[bin]]
name = "cekarna"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
chrono = { workspace = true }
spectra-audit = { workspace = true }
spectra-probe = { path = "../crates/spectra-probe" }
# 0.40 + feature `serde_json` : requis pour que serde_json::Value implémente
# ToSql/FromSql, et pour n'avoir qu'une seule version de libsqlite3-sys dans le
# workspace (un seul crate peut déclarer links = "sqlite3").
rusqlite = { workspace = true }
futures = "0.3"
tokio = { version = "1.35", features = ["full"] }
crossbeam-channel = "0.5"
once_cell = "1.19"
rand = "0.9"
tokio-util = "0.7"
uuid = { version = "1.6", features = ["v4"] }
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }

[dev-dependencies]
tempfile = "3.10"
# Vérifie que les regex des sondes compilent avant l'exécution.
regex = { workspace = true }

[features]
default = ["tauri/custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
reqwest = ["dep:reqwest"]
