[package]
name = "spectra-plugins"
version = "0.1.0"
description = "Runtime Extism WASM pour SPECTRA : sandbox, host functions, manifeste, signature."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
spectra-core = { workspace = true }
spectra-transform = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Runtime WASM via Extism
extism = "1.30"

# Parsing manifeste TOML
toml = "0.8"

# Hachage / signature
hex = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["serde", "zeroize"] }

[lints]
workspace = true
