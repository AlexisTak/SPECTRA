<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SPECTRA — répétabilité de la mesure</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b1120; color: #e2e8f0;
             font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; }
      #graph { position: absolute; inset: 0; }
      #hud { position: absolute; top: 12px; left: 12px; z-index: 10;
             background: rgba(15,23,42,.94); border: 1px solid #1e293b;
             border-radius: 8px; padding: 14px 18px; min-width: 340px; }
      h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .04em;
           text-transform: uppercase; color: #94a3b8; }
      table { border-collapse: collapse; width: 100%; margin-top: 8px; }
      th, td { padding: 3px 8px; text-align: right; font-variant-numeric: tabular-nums; }
      th:first-child, td:first-child { text-align: left; color: #94a3b8; }
      thead th { color: #cbd5e1; border-bottom: 1px solid #1e293b; }
      #verdict { margin-top: 12px; padding-top: 10px;
                 border-top: 1px solid #1e293b; color: #fbbf24; }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="hud">
      <h1>Répétabilité</h1>
      <div id="status">Mesure en cours…</div>
      <div id="out"></div>
      <div id="verdict"></div>
    </div>
    <script type="module">
      import { runRepeat } from './bench-repeat.ts'

      const p = new URLSearchParams(location.search)
      const nodes = Number(p.get('nodes') ?? 20000)
      const edges = Number(p.get('edges') ?? 60000)
      const times = Number(p.get('times') ?? 5)

      runRepeat(nodes, edges, times).then((s) => {
        document.getElementById('status').textContent =
          `${s.nodes.toLocaleString('fr-FR')} nœuds — ${s.runs.length} passes`
        const body = s.runs.map((r) => `
          <tr><td>passe ${r.run}</td><td>${r.fpsAvg}</td>
              <td>${r.fpsP5}</td><td>${r.longestFrameMs} ms</td></tr>`).join('')
        document.getElementById('out').innerHTML = `
          <table>
            <thead><tr><th></th><th>FPS moy</th><th>FPS p5</th><th>Frame max</th></tr></thead>
            <tbody>${body}</tbody>
          </table>`
        document.getElementById('verdict').textContent =
          `min ${s.fpsAvgMin} / médiane ${s.fpsAvgMedian} / max ${s.fpsAvgMax} — ${s.verdict}`
      })
    </script>
  </body>
</html>
