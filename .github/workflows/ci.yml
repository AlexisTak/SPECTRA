name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Le formatage et les lints stricts (clippy::pedantic, unwrap_used) ne
      # s'appliquent qu'aux crates `spectra-*`. Le crate hérité `cekarna` est
      # seulement tenu de compiler tant que sa dette technique n'est pas
      # résorbée (33 avertissements restants, voir audit.md) : l'aligner
      # maintenant produirait un diff de reformatage masquant les vraies
      # corrections.
      - name: Format — crates spectra
        run: cargo fmt -p spectra-core -p spectra-store -p spectra-audit -p spectra-report -p spectra-ai --check

      - name: Clippy — crates spectra (strict)
        run: cargo clippy -p spectra-core -p spectra-store -p spectra-audit -p spectra-report -p spectra-ai --all-targets -- -D warnings

      - name: Clippy — workspace complet (non bloquant sur le hérité)
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

  supply-chain:
    name: Chaîne d'approvisionnement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Licences et interdictions : le cœur est AGPL-3.0, aucune dépendance
      # sous licence incompatible ou non libre n'est acceptée (CLAUDE.md C5).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run --passWithNoTests
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high
